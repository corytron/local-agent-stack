# Secret and private-data scan of this repository (gitleaks 8.30, pinned by tools/setup-checks.sh;
# run by tools/check.sh's "secrets" check over the working tree with `gitleaks dir` and over the
# history with `gitleaks git`, by CI's Secrets job on a full-depth checkout, and by the pre-push
# hook). gitleaks' default rules stay on; this file adds what they cannot know: addresses on a
# private LAN, the gateway's sk- keys, and e-mail addresses (CLAUDE.md, "The repository is
# public"). The allowlists carry only the documented placeholders (192.0.2.x, lab.example.com,
# sk-local-...) and textbook values. A finding that is none of those is a finding: fix the file,
# or rewrite the history; never add a real value here.
title = "local-agent-stack gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Generated and cached files, and the documented placeholders"
paths = [
    # Generated output (gitignored): the guide's HTML and PDF.
    '''^build/''',
    # Python and ruff caches, virtual environments (gitignored).
    '''(^|/)__pycache__/''',
    '''(^|/)\.ruff_cache/''',
    '''(^|/)\.venv/''',
]
regexes = [
    # RFC 5737 TEST-NET-1: 192.0.2.10 TrueNAS, 192.0.2.20 the workstation, and the rest of it.
    '''^192\.0\.2\.[0-9]{1,3}$''',
    # The placeholder domain and every name under it.
    '''(?i)(^|[./@])lab\.example\.com$''',
    # Placeholder gateway keys: sk-local-... written as words (example, placeholder, change-me, replace),
    # x's or zeros, never random.
    '''^sk-local-(?:\.\.\.|x+|X+|0+|(?:example|placeholder|change-?me|replace)[A-Za-z0-9_-]*)$''',
]

# An IPv4 address on a private LAN (RFC 1918): the owner's network never goes in. Documentation
# uses 192.0.2.x (TEST-NET-1), which is not in these ranges.
[[rules]]
id = "lan-address"
description = "IPv4 address in a private (RFC 1918) range"
regex = '''\b(?:10(?:\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){3}|172\.(?:1[6-9]|2[0-9]|3[01])(?:\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){2}|192\.168(?:\.(?:25[0-5]|2[0-4][0-9]|1?[0-9]?[0-9])){2})\b'''
keywords = ["10.", "172.", "192.168."]
[[rules.allowlists]]
description = "The base addresses of the private ranges and of Docker's default address pool, written as CIDR blocks"
regexes = [
    '''^(?:10\.0\.0\.0|172\.16\.0\.0|172\.17\.0\.0|192\.168\.0\.0)$''',
]

# A key in the shape LiteLLM and llama-swap use (sk- and 20 or more key characters): a master,
# salt, virtual or llama-swap key. tools/secrets.py generates them as sk- plus 48 letters and
# digits; the guide and the examples write sk-local-...
[[rules]]
id = "gateway-key"
description = "sk- key (LiteLLM master, salt or virtual key; llama-swap API key)"
regex = '''\b(sk-[A-Za-z0-9_-]{20,})'''
secretGroup = 1
keywords = ["sk-"]

# An e-mail address (the ACME account address, a git identity): only example domains and
# GitHub's no-reply addresses may appear.
[[rules]]
id = "email-address"
description = "E-mail address outside the example domains"
regex = '''\b([A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,})\b'''
secretGroup = 1
keywords = ["@"]
[[rules.allowlists]]
description = "Example domains (RFC 2606), GitHub's no-reply addresses and git's SSH user"
regexes = [
    '''(?i)@(?:[A-Za-z0-9-]+\.)*example\.(?:com|org|net)$''',
    '''(?i)@users\.noreply\.github\.com$''',
    '''(?i)^git@github\.com$''',
    '''(?i)^noreply@anthropic\.com$''',
]
