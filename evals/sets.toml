# Run sets of tools/eval.py (evals/README.md). `tools/eval.py run --suite <set>` runs the cases a
# set pins, in the order of `suites` and then the order of each suite file. Case IDs are stable:
# a case is never renumbered or reused; a changed case gets a new ID, or its suite a new version.
# This file is part of the configuration hash (tools/eval.py config-hash).

# The suite files evals/suites/<name>.jsonl, in run and report order.
suites = ["tools", "format", "coding", "rag"]

# Optional cases: `cases = "all"` leaves them out, so they run only in a set that pins them by ID.
# format-011 sends a PNG (evals/images/maple-74.png) on the OpenAI route and needs the vision
# projector (docs/v1.2-design.md §3). It stays optional, outside smoke and full, until it has
# passed on the server; then remove it from this list (that changes the configuration hash).
optional = ["format-011"]

[sets.smoke]
description = "A fixed 15-case subset of every suite, a few minutes on the GPU: run after every change."
cases = [
    "tools-001",
    "tools-005",
    "tools-007",
    "tools-009",
    "tools-011",
    "tools-014",
    "tools-015",
    "tools-016",
    "format-001",
    "format-006",
    "format-009",
    "coding-001",
    "coding-003",
    "rag-001",
    "rag-006",
]

[sets.full]
description = "Every case of every suite except the optional ones: run before a release and to decide on a change."
cases = "all"

[sets.vision]
description = "Optional: the image case on the OpenAI route (CPU vision projector), until it is verified on the server."
cases = ["format-011"]
