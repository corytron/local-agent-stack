# Regression gate of tools/eval.py compare (evals/README.md). compare exits 1 when a rule below
# fails between a baseline result and a new result. It is not part of the configuration hash:
# changing a threshold changes the verdict, not the results.

[gate]
# A suite fails when its pass rate, over the cases both runs share, drops by more than this many
# percentage points. One case is 5 points of the 20-case tools suite, 10 of format, 12.5 of
# coding and about 16.7 of rag, so in the small suites a single newly failing case fails the gate.
pass_rate_drop_points = 5.0

# The run fails when the median output tokens per second, over the cases both runs share, drops by
# more than this percentage.
tokens_per_second_drop_percent = 15.0

# The speed rule is applied only when both runs have at least this many cases with a speed.
min_cases_for_speed = 5

# A suite can have its own pass-rate threshold, for example to tolerate one case of noise:
# [gate.suites.coding]
# pass_rate_drop_points = 12.5
